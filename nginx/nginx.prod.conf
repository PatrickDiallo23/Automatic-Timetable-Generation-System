# ─────────────────────────────────────────────────────────────────────────────
# nginx/nginx.prod.conf  —  Production Nginx config
#
# Differences from nginx.conf (dev):
#   • Upstream includes both backend + backend2 replicas
#   • Swagger UI blocked (returns 403)
#   • Stricter security headers (HSTS, CSP)
#   • Access log disabled for health checks
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 2048;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time us=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens      off;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"                 always;
    add_header X-Frame-Options          "DENY"                    always;
    add_header X-XSS-Protection         "1; mode=block"           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    # Uncomment and configure CSP when ready:
    # add_header Content-Security-Policy "default-src 'self'; ..." always;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=60r/m;

    client_max_body_size 20M;

    # ── Upstream: both backend replicas (least_conn load balancing) ───────────
    upstream backend_servers {
        least_conn;
        server backend:8200  max_fails=3 fail_timeout=30s;
        server backend2:8200 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── HTTP Server Block: Port 80 (Docker healthcheck and SSL redirect) ──────
    server {
        listen 80;
        server_name _;

        # ── Health probe (used by Docker HEALTHCHECK) ──────────────────────
        location = /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Server Block: Port 443 (Main TLS application entry point) ───────
    server {
        listen 443 ssl;
        server_name _;

        # SSL/TLS Certificates (mounted from host)
        ssl_certificate     /etc/nginx/ssl/localhost+2.pem;
        ssl_certificate_key /etc/nginx/ssl/localhost+2-key.pem;

        # Optimized SSL Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # ── API traffic → backend upstream ────────────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=30 nodelay;

            proxy_pass         https://backend_servers;
            proxy_ssl_verify   off;                       # Backend uses self-signed mkcert keystore
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout  10s;
            proxy_send_timeout     600s;
            proxy_read_timeout     600s;
            proxy_buffering off;
        }

        # ── Auth endpoints: tighter rate limit ────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth_zone burst=3 nodelay;

            proxy_pass         https://backend_servers;
            proxy_ssl_verify   off;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Block Swagger in production
        location ~ ^/(swagger-ui|api-docs) {
            return 403;
        }

        # ── Everything else → Angular SPA ─────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 404 = /;
        }
    }
}
