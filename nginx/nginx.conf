# ─────────────────────────────────────────────────────────────────────────────
# Nginx: Load Balancer / Reverse Proxy
#
# Topology:
#   Client → Nginx (80) → frontend (port 80 internal)
#                       → backend upstream (port 8200 internal)
#
# In DEV:  single backend replica, Swagger accessible
# In PROD: two backend replicas (backend1 + backend2), Swagger disabled
# ─────────────────────────────────────────────────────────────────────────────

# Worker count matches CPU cores; auto is the safest default
worker_processes auto;

# Increase open file limit (useful for large concurrent connections)
worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time us=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Performance ─────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens      off;   # Hide Nginx version in headers

    # ── Compression ─────────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml;

    # ── Security headers (applied globally) ─────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"         always;
    add_header X-Frame-Options          "SAMEORIGIN"      always;
    add_header X-XSS-Protection         "1; mode=block"   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── Rate limiting (protect auth endpoints) ───────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=100r/m;

    # ── Client body limits ───────────────────────────────────────────────────
    client_max_body_size 20M;

    # ─────────────────────────────────────────────────────────────────────────
    # Upstream: Backend Spring Boot instances (round-robin by default)
    # In DEV compose: only "backend" service exists.
    # In PROD compose: "backend1" and "backend2" are both declared.
    # ─────────────────────────────────────────────────────────────────────────
    upstream backend_servers {
        least_conn;                    # Route to the backend with fewest active connections
        server backend:8200 max_fails=3 fail_timeout=30s;
        # Production adds a second server via docker-compose.prod.yml override
        keepalive 32;                  # Keep 32 upstream keepalive connections
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Virtual host: main entry point
    # ─────────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Health probe (used by Docker HEALTHCHECK) ──────────────────────
        location = /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ── API traffic → backend upstream ────────────────────────────────
        location /api/ {
            limit_req zone=api_zone burst=50 nodelay;

            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";          # Enable keepalive to upstream
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeouts (Timefold solve can take minutes: adjust spent-limit)
            proxy_connect_timeout  10s;
            proxy_send_timeout     600s;   # Long timeout for solver endpoint
            proxy_read_timeout     600s;

            proxy_buffering off;           # Disable for SSE / streaming endpoints
        }

        # ── Auth endpoints: tighter rate limit ────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth_zone burst=5 nodelay;

            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Swagger UI (DEV only – disable in prod via override) ──────────
        location ~ ^/(swagger-ui|api-docs) {
            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Everything else → Angular SPA ─────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Angular SPA: serve index.html for client-side routes
            proxy_intercept_errors on;
            error_page 404 = /;
        }
    }
}
