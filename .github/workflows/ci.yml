name: Fullstack CI

on:
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-build-and-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./timetable-app-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests and Build
        run: mvn -B clean verify

      # TODO: Implement Code Coverage Reporting
      # Example: Upload JaCoCo reports to Codecov or add a GitHub Action to comment coverage directly on the PR.

      # TODO: Implement Docker Build Verification
      # Example: Run `docker build -t timetable-backend .` to ensure the backend Docker image builds successfully.

      # TODO: Implement Deployment Steps (Open for extension)
      # This workflow currently only builds and tests. If deployment is needed in the future, 
      # you can add a new job that depends on this one (needs: backend-build-and-test), 
      # or append steps here that only run on pushes to the main branch.
      # Example:
      # - name: Deploy Backend
      #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      #   run: ./deploy-backend.sh

  frontend-build-and-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./timetable-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './timetable-app/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Headless Tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build Production Bundle
        run: npm run build -- --configuration production

      # TODO: Implement Code Coverage Reporting
      # Example: Upload Karma coverage reports to Codecov.

      # TODO: Implement Docker Build Verification
      # Example: Run `docker build -t timetable-frontend .` to ensure the frontend Docker image builds successfully.

      # TODO: Implement Deployment Steps (Open for extension)
      # This workflow currently only builds and tests. If deployment is needed in the future,
      # you can add a new job that depends on this one (needs: frontend-build-and-test),
      # or append steps here that only run on pushes to the main branch.
      # Example:
      # - name: Deploy Frontend
      #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      #   run: ./deploy-frontend.sh

