# ============================================================
# CI Test Profile — loaded when -Dspring.profiles.active=ci
# Overrides the main datasource to use the GitHub Actions
# PostgreSQL service container instead of a local database.
# ============================================================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/timetable_test}
spring.datasource.username=${DATABASE_USERNAME:test}
spring.datasource.password=${DATABASE_PASSWORD:test}

# Let Hibernate create the schema from entity definitions and
# drop it again when the test context closes.
spring.jpa.hibernate.ddl-auto=create-drop
