# ──────────────────────────────────────────────────────────────────────────────
# Spring Boot: Docker profile properties
#
# Activated when SPRING_PROFILES_ACTIVE=dev (docker dev environment)
# These override the defaults in application.properties for container networking.
# ──────────────────────────────────────────────────────────────────────────────

# Database URL uses the Docker Compose service name "postgres" as the hostname
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/timetable_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:timetable_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:timetable_dev_password}

# Show SQL only in dev
spring.jpa.show-sql=true

# Actuator: expose health endpoint for Docker HEALTHCHECK
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Server port (same as production)
server.port=8200

# Timefold: shorter solve limit for dev to get faster feedback
timefold.solver.termination.spent-limit=${TIMEFOLD_TERMINATION_LIMIT:6m}
