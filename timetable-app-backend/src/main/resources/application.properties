### Timefold Solver configuration ###

timefold.solver.termination.spent-limit=${TIMEFOLD_TERMINATION_LIMIT:600m}
#timefold.solver.termination.best-score-limit=0hard/*soft
#uncomment FULL_ASSERT
#timefold.solver.environment-mode=FULL_ASSERT
#timefold.benchmark.solver-benchmark-config-xml=to be defined + timespent
#config.xml
timefold.solver-config-xml=timetableSolverConfig.xml
#logging.level.ai.timefold.solver=DEBUG

# To change how many solvers to run in parallel
#timefold.solver-manager.parallel-solver-count=4
# Disable move-thread-count because multi-threaded incremental solving is a Timefold Solver Enterprise feature.
# Using it in the Community Edition would cause a warning or startup error.
#timefold.solver.move-thread-count=AUTO

### Job Map TTL Configuration ###
# Time-to-live in hours for completed solver jobs (default: 8)
timetableApp.job.ttl-hours=8
# Cleanup interval in milliseconds (default: 1800000 = 30 minutes)
timetableApp.job.cleanup-interval-ms=1800000

### Swagger configuration ###

springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true

springdoc.show-actuator=false
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json
