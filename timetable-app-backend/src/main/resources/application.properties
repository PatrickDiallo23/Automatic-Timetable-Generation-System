logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(${LOG_LEVEL_PATTERN:%5p}) %blue([%-15.15t]) - %logger{36} - %msg%n

## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
# Falls back to local dev values when env vars are not set (i.e. running outside Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/your_database}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:your_username}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_password}

# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.hbm2ddl.auto=create-drop

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=false

# server port
server.port=8200

### Secret key (generate SignatureAlgorithm.HS256 base64 string key) — override via TIMETABLEAPP_SECRETKEY env var in Docker/prod
timetableApp.secretKey=${TIMETABLEAPP_SECRETKEY:<YOUR_SECRET_KEY>}

