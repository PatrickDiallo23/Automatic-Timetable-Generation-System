# ──────────────────────────────────────────────────────────────────────────────
# Spring Boot: Production profile properties
#
# Activated when SPRING_PROFILES_ACTIVE=prod
# ──────────────────────────────────────────────────────────────────────────────

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Never show SQL in production
spring.jpa.show-sql=false

# Expose only health (not info, metrics) — metrics handled by external tool
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.port=8200

# Full 6-minute solve limit in production
timefold.solver.termination.spent-limit=${TIMEFOLD_TERMINATION_LIMIT:6m}

# Swagger disabled in production (also blocked at Nginx level)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
