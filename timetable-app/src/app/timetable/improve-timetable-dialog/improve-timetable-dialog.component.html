<h2 mat-dialog-title>Improve Timetable Generation</h2>
<mat-dialog-content>
  <p>The solver will rerun using the current timetable as the starting point. This enables further optimization of existing schedules.</p>
  <p>Please enter how long the solver should run (in minutes):</p>
  <div class="basic-settings">
    <mat-form-field appearance="fill" style="width: 100%;">
      <mat-label>Duration (Minutes)</mat-label>
      <input matInput type="number" [(ngModel)]="durationMinutes" min="1" max="120" />
      <mat-error *ngIf="durationMinutes <= 0 || durationMinutes > 120">
        Please enter a value between 1 and 120.
      </mat-error>
    </mat-form-field>
  </div>

</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="durationMinutes <= 0 || durationMinutes > 120" (click)="onConfirm()">Start Optimizing</button>
</mat-dialog-actions>
