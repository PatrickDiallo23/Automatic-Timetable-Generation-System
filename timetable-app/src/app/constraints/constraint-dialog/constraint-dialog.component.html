<div mat-dialog-title>
    <h1>Constraint Form</h1>
</div>

<form [formGroup]="constraintForm" (ngSubmit)="onFormSubmit()">
    <div mat-dialog-content class="content">


        <mat-form-field appearance="outline">
            <mat-label>Select Constraint</mat-label>
            <mat-select formControlName="description">
                <mat-option *ngFor="let meta of availableConstraints" [value]="meta.id">
                    {{ meta.title }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <mat-card *ngIf="selectedMeta" style="margin-bottom: 20px; background-color: #f5f5f5; padding: 15px; box-shadow: none;">
            <mat-card-subtitle style="color: #3f51b5; font-weight: bold; margin-bottom: 5px;">Description</mat-card-subtitle>
            <p style="margin: 0 0 10px 0; font-size: 14px;">{{ selectedMeta.description }}</p>
            
            <mat-card-subtitle style="color: #e91e63; font-weight: bold; margin-bottom: 5px;">Recommendation</mat-card-subtitle>
            <p style="margin: 0; font-size: 14px;"><strong>{{ selectedMeta.recommendedWeight }}</strong> - {{ selectedMeta.recommendationReason }}</p>
        </mat-card>

        <br *ngIf="!selectedMeta">

        <mat-form-field appearance="outline">
            <mat-label>Constraint Weight</mat-label>
            <mat-select formControlName="weight">
                <mat-option *ngFor="let val of weight" [value]="val">{{val}}
                </mat-option>
            </mat-select>
        </mat-form-field>


    </div>
    <div mat-dialog-actions class="action">
        <button mat-raised-button type="button" [mat-dialog-close]="false">Cancel</button>
        <button mat-raised-button color="primary" type="submit">{{data ? 'Update': 'Save'}}</button>
    </div>
</form>
