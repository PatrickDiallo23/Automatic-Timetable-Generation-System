# ─────────────────────────────────────────────────────────
# Nginx: Per-service config for the Angular container
# Serves static files and proxies /api/* to the backend
# (the backend host is resolved from the Docker network)
# ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip compression for static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Angular SPA: fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health probe endpoint (used by Docker HEALTHCHECK)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Cache long-lived hashed assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff2?|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
